max_steps = 10

[model]
name = "Qwen/Qwen2.5-0.5B-Instruct"
revision = "7ae557604adf67be50417f59c2c2f167def9a775"
seq_len = 128
impl = "hf"
attn = "flash_attention_2"

[model.lora]
rank = 8
alpha = 16.0

[optim]
type = "adamw"
lr = 0.00003

[loss]
type = "default"
kl_tau = 0.01

[ckpt]
interval = 1
weights = "None"

[file_monitor]
filename = "metrics.jsonl"

[wandb]
project = "aether-rl-reverse-text"
name = "qwen2.5-0.5b-reverse-text"
group = "distributed-learning-proof"
tags = ["grpo", "distributed", "reverse-text"]
create_overview = false
log_metrics = [
    "loss/mean",
    "entropy/all/mean",
    "mismatch_kl/all/mean",
    "optim/grad_norm",
    "optim/lr",
    "perf/throughput",
    "time/step",
    "time/wait_for_batch",
    "system/ckpt_disk_free_gib",
]
