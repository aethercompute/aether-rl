max_steps = 50

[model]
name = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"
seq_len = 32768
impl = "custom"
attn = "flash_attention_2"

[model.lora]
rank = 64
alpha = 128.0
target_modules = [
    "q_proj",
    "k_proj",
    "v_proj",
    "o_proj",
    "in_proj_qkv",
    "in_proj_z",
    "in_proj_a",
    "in_proj_b",
    "out_proj",
    "gate_proj",
    "up_proj",
    "down_proj",
]

[tokenizer]
name = "Qwen/Qwen3.5-4B"
revision = "851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a"

[optim]
type = "adamw"
lr = 0.00001
max_norm = 1.0

[scheduler]
type = "constant"

[loss]
type = "default"
dppo_mask_low = 0.2
dppo_mask_high = 0.2
kl_tau = 0.001

[ckpt]
interval = 1
weights = "None"

[file_monitor]
filename = "metrics.jsonl"

[wandb]
project = "aether-rl-swe"
name = "qwen3p5-4b-r2e-pilot-v1"
group = "qwen3.5-4b-r2e"
tags = ["maxrl", "swe", "r2e-gym", "mini-swe-agent", "qwen3.5", "lora", "distributed"]
create_overview = false
log_metrics = [
    "loss/mean",
    "entropy/all/mean",
    "mismatch_kl/all/mean",
    "optim/grad_norm",
    "optim/lr",
    "perf/throughput",
    "time/step",
    "time/wait_for_batch",
    "system/ckpt_disk_free_gib",
]
