max_steps = 80

[model]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
revision = "ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562"
seq_len = 20480
impl = "hf"
attn = "flash_attention_2"

[model.lora]
rank = 32
alpha = 64.0
dropout = 0.0
target_modules = ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]

[tokenizer]
name = "deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
revision = "ad9f0ae0864d7fbcd1cd905e3c6c5b069cc8b562"

[optim]
type = "adamw"
lr = 0.00001
max_norm = 1.0

[scheduler]
type = "constant"

[loss]
type = "default"
dppo_mask_low = 0.2
dppo_mask_high = 0.2
kl_tau = 0.0
rl_normalization = "dr_grpo"
dr_grpo_max_completion_tokens = 16384

[ckpt]
interval = 1
weights = "None"

[file_monitor]
filename = "metrics.jsonl"

[wandb]
project = "aether-rl-math"
name = "deepseek-r1-1p5b-dapo-efficient-v3"
group = "dapo-math-1.5b"
tags = ["dr-grpo", "math", "dapo", "deepseek-r1", "thinking-efficiency", "lora"]
create_overview = false
log_metrics = [
    "loss/mean",
    "entropy/all/mean",
    "mismatch_kl/all/mean",
    "optim/grad_norm",
    "optim/lr",
    "perf/throughput",
    "time/step",
    "time/wait_for_batch",
    "system/ckpt_disk_free_gib",
]
