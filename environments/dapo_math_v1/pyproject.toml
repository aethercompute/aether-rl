[project]
name = "dapo-math-v1"
version = "0.1.0"
description = "Single-turn English DAPO math with strict integer grading."
requires-python = ">=3.11"
dependencies = ["datasets", "transformers", "verifiers>=0.2.2.dev5"]
tags = ["math", "single-turn", "v1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dapo_math_v1"]
