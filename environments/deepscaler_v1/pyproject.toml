[project]
name = "deepscaler-v1"
version = "0.1.0"
description = "DeepScaleR preview math training tasks with rule-based grading."
requires-python = ">=3.11"
tags = ["single-turn", "v1"]
dependencies = ["verifiers>=0.2.0", "datasets"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepscaler_v1"]
